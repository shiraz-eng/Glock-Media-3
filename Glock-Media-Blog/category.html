<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category — Glock Media Blog</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest" defer></script>
<style>
:root{--bg-primary:#0a0a0a;--bg-secondary:#111;--bg-card:#161616;--bg-card-hover:#1c1c1c;--border:#222;--border-hover:#333;--text-primary:#fff;--text-secondary:#a0a0a0;--text-muted:#666;--finance:#10b981;--tech:#3b82f6;--sports:#f59e0b;--education:#8b5cf6;--entertainment:#ec4899;--health:#ef4444;--gaming:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.6}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.nav-logo-text{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.4rem;letter-spacing:.12em;color:#f5f5f5;text-transform:uppercase}
.nav-logo-media{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:.3em;color:#d4a843;text-transform:uppercase}
.nav-links{display:flex;gap:32px;align-items:center}
.nav-link{color:var(--text-secondary);text-decoration:none;font-size:.9rem;font-weight:500}
.nav-link:hover{color:#fff}
.nav-cta{padding:10px 28px;background:linear-gradient(135deg,#8b1a1a,#5c1212);color:#f5f5f5;border-radius:100px;font-size:.85rem;font-weight:600;text-decoration:none}
.cat-hero{padding:160px 40px 80px;text-align:center;max-width:1000px;margin:0 auto}
.cat-hero-label{display:inline-block;padding:8px 20px;border:1px solid var(--border);border-radius:100px;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:24px}
.cat-hero-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.5rem,6vw,5rem);font-weight:700;letter-spacing:-0.03em;line-height:1.1;margin-bottom:20px}
.cat-hero-subtitle{color:var(--text-secondary);font-size:1.1rem;max-width:600px;margin:0 auto}
.section{padding:40px;max-width:1400px;margin:0 auto}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
@media(max-width:1024px){.blog-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.blog-grid{grid-template-columns:1fr}}
.blog-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.4s cubic-bezier(.16,1,.3,1);text-decoration:none;color:inherit;display:flex;flex-direction:column}
.blog-card:hover{transform:translateY(-6px);background:var(--bg-card-hover);border-color:var(--border-hover)}
.blog-card-image-wrapper{position:relative;height:220px;overflow:hidden}
.blog-card-image{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.blog-card:hover .blog-card-image{transform:scale(1.08)}
.blog-card-image-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 60%,rgba(0,0,0,.5))}
.blog-card-content{padding:24px;flex:1;display:flex;flex-direction:column}
.blog-card-meta{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.75rem;color:var(--text-muted)}
.blog-card-category{padding:4px 12px;border-radius:100px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.blog-card-category.finance{background:rgba(16,185,129,.15);color:var(--finance)}
.blog-card-category.tech{background:rgba(59,130,246,.15);color:var(--tech)}
.blog-card-category.sports{background:rgba(245,158,11,.15);color:var(--sports)}
.blog-card-category.education{background:rgba(139,92,246,.15);color:var(--education)}
.blog-card-category.entertainment{background:rgba(236,72,153,.15);color:var(--entertainment)}
.blog-card-category.health{background:rgba(239,68,68,.15);color:var(--health)}
.blog-card-category.gaming{background:rgba(6,182,212,.15);color:var(--gaming)}
.blog-card-dot{width:3px;height:3px;background:var(--text-muted);border-radius:50%}
.blog-card-title{font-family:'Space Grotesk',sans-serif;font-size:1.25rem;font-weight:600;line-height:1.3;margin-bottom:12px}
.blog-card-excerpt{color:var(--text-secondary);font-size:.9rem;margin-bottom:20px;flex:1}
.blog-card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid var(--border);font-size:.8rem;color:var(--text-muted)}
.blog-card-author{display:flex;align-items:center;gap:8px}
.blog-card-author-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover}
.empty{text-align:center;padding:80px 20px;color:var(--text-muted)}
</style>
</head>
<body>
<nav class="nav">
  <a href="/index.html" class="nav-logo"><span class="nav-logo-text">GLOCK</span><span class="nav-logo-media">MEDIA</span></a>
  <div class="nav-links" id="dynamicNav">
    <a href="/Glock-Media-Blog/glock-media-blog.html" class="nav-link">All Blogs</a>
    <a href="https://calendly.com/shahriyarkhan593/new-meeting" class="nav-cta" target="_blank" rel="noopener">Book a Call</a>
  </div>
</nav>

<section class="cat-hero">
  <div class="cat-hero-label" id="catLabel">Category</div>
  <h1 class="cat-hero-title" id="catTitle">Loading…</h1>
  <p class="cat-hero-subtitle" id="catSub">Fetching articles…</p>
</section>

<section class="section">
  <div class="blog-grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No posts in this category yet.</div>
</section>

<script type="module" src="/Admin-Panel/nav-loader.js"></script>
<!-- Static Data Fallback -->
<script src="/js/data.js"></script>
<script type="module">
import { fetchCategoryBySlug, fetchBlogs, blogCardHTML, isValidRealBlog } from "./blog-frontend.js";

const slug = new URLSearchParams(location.search).get("slug");
async function boot(){
  const cat = slug ? await fetchCategoryBySlug(slug) : null;
  if (cat) {
    document.title = cat.name + " — Glock Media Blog";
    document.getElementById("catLabel").textContent = "Category";
    document.getElementById("catTitle").textContent = cat.name;
    document.getElementById("catSub").textContent = `All articles in ${cat.name}.`;
  } else {
    document.getElementById("catTitle").textContent = slug || "Unknown";
  }
  const blogs = await fetchBlogs({ categorySlug: slug });
  
  // Keep only valid real blogs from Firestore
  let allMerged = (blogs || []).filter(isValidRealBlog);

  // Sort by date desc (recently added show first)
  allMerged.sort((a, b) => (b.publishDate || "").localeCompare(a.publishDate || ""));

  const grid = document.getElementById("grid");
  if (!allMerged.length) {
    document.getElementById("empty").style.display = "block";
    return;
  }
  grid.innerHTML = allMerged.map(b => blogCardHTML(b, { initial:true })).join("");
  if (window.lucide) window.lucide.createIcons();
}
boot().catch(e => { console.error(e); document.getElementById("empty").textContent = "Failed to load."; document.getElementById("empty").style.display = "block"; });
</script>
</body>
</html>
